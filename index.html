    const bad = x.phone && !phoneValid(x.phone);
    const num = x.on && !x.dup ? ++n : '';
    return `${opts && opts.sepAt === i ? opts.sepHtml : ''}<div class="ep-row ${x.dup ? 'dup' : ''} ${x.on ? '' : 'off'}">
      <label class="ep-check"><input type="checkbox" data-i="${i}" ${x.on ? 'checked' : ''} ${x.dup ? 'disabled' : ''}><span class="num-badge">${num}</span></label>
      <div class="ep-main">
        <div class="wz-two">
          <input class="ep-in" data-f="name" data-i="${i}" value="${escHtml(x.name)}" placeholder="שם מלא" ${x.dup ? 'disabled' : ''}>
          <input class="ep-in" data-f="city" data-i="${i}" value="${escHtml(x.city)}" placeholder="יישוב" ${x.dup ? 'disabled' : ''}>
        </div>
        <input class="ep-in ep-phone ${bad ? 'bad' : ''}" data-f="phone" data-i="${i}" value="${escHtml(x.phone)}" inputmode="tel" placeholder="טלפון" ${x.dup ? 'disabled' : ''}>
        ${x.dup ? `<div class="ep-note">${opts && opts.dupText || 'כבר ברשימה'}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}
// v49: מספור מחדש של השורות המסומנות בלבד
function renumberEp() {
  let n = 0;
  document.querySelectorAll('.ep-row').forEach(r => {
    const b = r.querySelector('.num-badge');
    if (!b) return;
    const on = !r.classList.contains('off') && !r.classList.contains('dup');
    b.textContent = on ? ++n : '';
  });
  const lbl = document.getElementById('wzCount');
  if (lbl) lbl.textContent = n;
}
function bindEditablePeople(list, onChange) {
  const renum = onChange || renumberEp;
  document.querySelectorAll('.ep-row input[type=checkbox]').forEach(cb => cb.onchange = () => {
    list[+cb.dataset.i].on = cb.checked; cb.closest('.ep-row').classList.toggle('off', !cb.checked);
    renum();
  });
  document.querySelectorAll('.ep-in').forEach(inp => inp.oninput = () => {
    const x = list[+inp.dataset.i];
    x[inp.dataset.f] = inp.value.trim();
    if (inp.dataset.f === 'phone') { inp.classList.toggle('bad', !!inp.value.trim() && !phoneValid(inp.value)); if (onChange) renum(); }
  });
}

// ════════ יצירת הדרכה: 2 שלבים ════════
let WZ = null;

function trWizard() {
  WZ = { id: trUid(), date: isoToday(), type: (TR_TYPES && TR_TYPES[0]) || 'הדרכה בסיסית', time: '', place: '',
         test: false, people: [], paste: false };
  wzStep1();
}

function wzHead(n, title, hint) {
  return `<div class="wz-step">שלב ${n} מתוך 2</div><div class="wz-title">${title}</div><div class="wz-hint">${hint}</div>`;
}

function wzStep1() {
  tplShell('הדרכה חדשה', `
    ${wzHead(1, 'מאיפה מגיעה רשימת המשתתפים?', 'בחר אחת מהאפשרויות')}
    <button class="wz-card" id="wzPaste"><span class="wz-ic">📋</span><span><b>הדבק הודעת הרשמה מוואטסאפ</b><br>השמות, התאריך, השעה והמקום יזוהו לבד</span></button>
    <button class="wz-card" id="wzManual"><span class="wz-ic">✍️</span><span><b>בלי הודעה</b><br>אכניס את השמות בעצמי (כנס, אירוע, או כשאין הודעה)</span></button>`, trList);

function pasteScreen(title, sub, back, onNext) {
  tplShell(title, `
    ${sub}
    <textarea class="tpl-text" id="pasteText" spellcheck="false" placeholder="הדבק כאן את כל ההודעה"></textarea>
    <button class="tr-big-btn" id="pasteNext">המשך ←</button>`, back);
  const ta = document.getElementById('pasteText');
  ta.addEventListener('input', () => autoGrowEl(ta));

function wzPasteScreen() {
  pasteScreen('הדרכה חדשה',
    wzHead(1, 'הדבק את הודעת ההרשמה', 'בוואטסאפ: לחיצה ארוכה על ההודעה ← העתק. כאן: לחיצה ארוכה בתיבה ← הדבק'),
    wzStep1, txt => { wzParseMessage(txt); WZ.paste = true; wzStep2(); });
}

function parsePeople(text) {
  const seen = new Set();
  return cleanText(text).replace(/[*_~]/g, '').split(/\r?\n/).map(parseImportLine).filter(Boolean)
    .filter(x => { if (seen.has(x.phone)) return false; seen.add(x.phone); return true; });
}

// זיהוי פרטים מתוך הודעת ההרשמה
function wzParseMessage(txt) {
  const clean = cleanText(txt).replace(/[*_~]/g, '');
  const d = clean.match(/(\d{1,2})[./](\d{1,2})[./](\d{2,4})/);
  if (d) { const y = d[3].length === 2 ? '20' + d[3] : d[3]; WZ.date = `${y}-${pad2(d[2])}-${pad2(d[1])}`; }
  const tm = clean.match(/(?:בשעה|שעה)\s*(\d{1,2}):(\d{2})/) || clean.match(/\b(\d{1,2}):(\d{2})\b/);
  if (tm) WZ.time = `${pad2(tm[1])}:${tm[2]}`;
  const pl = clean.match(/תתקיים\s+ב([^\n.]+)/);
  if (pl) WZ.place = pl[1].trim();
  const t = (TR_TYPES || []).find(x => { const w = x.trim().split(/\s+/).pop(); return w && w.length > 2 && clean.includes(w); });
  if (t) WZ.type = t;
  WZ.people = parsePeople(txt).map(x => ({ ...x, on: true }));
}

function wzStep2() {
  tplShell('הדרכה חדשה', `
    ${wzHead(2, 'פרטים ומשתתפים', WZ.paste ? 'הפרטים זוהו מההודעה – בדוק ותקן אם צריך' : 'מלא את הפרטים. את המשתתפים תוסיף אחר כך')}
    ${trDetailsFields(WZ)}
    ${WZ.paste ? `<div class="tpl-label" style="margin-top:18px">משתתפים שזוהו (<span id="wzCount">${WZ.people.filter(x => x.on).length}</span>) – אפשר לתקן, או לבטל סימון</div>
      ${editablePeople(WZ.people) || '<div class="tpl-hint">לא נמצאו שורות עם מספר טלפון</div>'}` : ''}
    <button class="tr-big-btn" id="wzCreate">📝 פתח הרשמה</button>`, () => { wzRead(); WZ.paste ? wzPasteScreen() : wzStep1(); });
  bindEditablePeople(WZ.people);
  document.getElementById('wzCreate').onclick = wzCreate;
}
function wzRead() { if (document.getElementById('trDate')) trReadDetails(WZ); }

function wzCreate() {
  wzRead();
  const final = tplByTitle(DEF_FINAL);
  const t = {
    id: WZ.id, date: WZ.date, type: WZ.type, time: WZ.time, place: WZ.place, test: WZ.test, stage: 'הרשמה',
    msgReminder: tplByTitle(DEF_REMINDER) ? DEF_REMINDER : '',
    msgFinal: final ? DEF_FINAL : '',
    track: !!(final && FORM_LINK_RE.test(final.text)),
    people: WZ.people.filter(x => x.on && (x.name || x.phone))
      .map(x => ({ name: x.name, phone: normPhone(x.phone), city: x.city, status: 'נרשם', sentAt: '', note: '' })),
  };
  TRAININGS.push(t);
  TR_CUR = t; WZ = null; TR_VIEW_SCROLL = 0;
  trSaveNow();
  trView();
}

// ── שמירה לגיליון (עם השהיה קצרה, כדי לאחד כמה שינויים מהירים) ──
function trSaveSoon() {
  TR_SAVE_STATE = 'saving'; trSaveBadge();
  clearTimeout(TR_SAVE_TIMER);
  TR_SAVE_TIMER = setTimeout(trSaveNow, 800);
}
async function trSaveNow() {
  clearTimeout(TR_SAVE_TIMER);
  const t = TR_CUR;
  if (!t) return;
  TR_SAVE_STATE = 'saving'; trSaveBadge();
  try {
    await mediaCall('POST', { action: 'saveTraining', training: t });
    TR_SAVE_STATE = 'saved';
  } catch (e) {
    TR_SAVE_STATE = 'error';
    showToast('השמירה לגיליון נכשלה: ' + e.message, 'err');
  }
  trSaveBadge();
}
function trSaveBadge() {
  const el = document.getElementById('trSaveState');
  if (!el) return;
  el.textContent = TR_SAVE_STATE === 'saving' ? 'שומר...' : TR_SAVE_STATE === 'saved' ? '✓ נשמר' : TR_SAVE_STATE === 'error' ? '⚠️ לא נשמר – לחץ לנסות שוב' : '';
  el.className = 'tr-save ' + TR_SAVE_STATE;
  el.onclick = TR_SAVE_STATE === 'error' ? trSaveNow : null;
}

// ════════ מסך הדרכה ════════
function trOpen(id) {
  TR_CUR = TRAININGS.find(t => t.id === id) || null;
  TR_SAVE_STATE = '';
  TR_VIEW_SCROLL = 0;
  if (TR_CUR) trView(); else trList();
}

function stageBar(stage) {
  const k = STAGES.indexOf(stage);
  return `<div class="tr-stages">${STAGES.map((s, i) =>
    `<div class="tr-stg ${i < k ? 'done' : ''} ${i === k ? 'cur' : ''}" data-go="${s}"><span>${STAGE_IC[s]}</span>${s}</div>`).join('<div class="tr-stg-arrow">←</div>')}</div>`;
}

function trView() {
  const t = TR_CUR;
  if (!t) return trList();
  const stage = t.stage;
  const filled = filledSet();
  const c = trCounts(t, filled);
  const info = [t.time, t.place].filter(Boolean).join(' · ');

  // v50: סדר כמו בהודעת הוואטסאפ (סדר השמירה) – בלי מיון א-ב
  const ppl = (t.people || []).map((p, i) => ({ p, i }));

  // v49: מספור לפי הסדר במסך – רק מי שלא ביטל
  let n = 0;
  const rows = ppl.map(({ p, i }) => trPersonRow(t, p, i, filled, p.status === 'ביטל' ? '' : ++n)).join('');

  let summary;
  if (stage === 'הרשמה') summary = `נרשמו <b>${c.reg}</b>${c.cancel ? ` · ביטלו <b>${c.cancel}</b>` : ''}`;
  else summary = `הגיעו <b>${c.came}</b> מתוך <b>${c.reg}</b>${c.no ? ` · לא הגיעו <b>${c.no}</b>` : ''}${t.track ? ` · מילאו טופס <b>${c.filled}</b>` : ''}`;

  let top = '', bottom = '';
  const nextBtn = label => `<button class="tr-big-btn tr-next" id="trNext"><span>${label}</span><span class="tr-next-arrow">⬅</span></button>`;
  if (stage === 'הרשמה') {
    top = `
      ${nextBtn('✅ התחל הדרכה')}
      <button class="tr-big-btn ghost" id="trShare">📤 שלח רשימת נרשמים</button>
      <div class="tr-btn-row" style="margin-top:10px">
        <button class="tr-big-btn half ghost" id="trImport">📥 הדבק רשימה מעודכנת מוואטסאפ</button>
        <button class="tr-big-btn half ghost" id="trAdd">＋ הוסף משתתף</button>
      </div>`;
  } else if (stage === 'יום ההדרכה') {
    top = `
      ${nextBtn('🔒 סגור הדרכה')}
      <button class="tr-big-btn ghost" id="trShare">📤 שלח רשימת משתתפים</button>
      <div class="tr-btn-row" style="margin-top:10px"><button class="tr-big-btn ghost" id="trAdd">＋ הוסף משתתף שהגיע</button></div>`;
    bottom = `<button class="tr-link-btn" id="trBack">→ חזרה לשלב ההרשמה</button>`;
  } else {
    top = `<button class="tr-big-btn ghost" id="trShare">📤 שלח רשימת משתתפים</button>`;
    bottom = `<button class="tr-link-btn" id="trReopen">🔓 פתח מחדש לעריכה</button>`;
  }

  tplShell(`${t.type || 'הדרכה'} · ${isoToHe(t.date)}`, `
    ${stageBar(stage)}
    ${t.test ? '<div class="tr-test-banner">🧪 הדרכת ניסיון – לא נרשם בטאב המעקב</div>' : ''}
    ${info ? `<div class="tr-info">🕖 ${escHtml(info)}</div>` : ''}
    <div class="tr-summary">${summary}<span id="trSaveState" class="tr-save"></span></div>
    ${top}
    <div style="margin-top:12px">${rows || '<div class="tpl-empty">אין משתתפים עדיין</div>'}</div>
    ${bottom}
    <button class="tr-link-btn" id="trEditBtn">✏️ פרטי ההדרכה והודעות</button>`, trList);
  trSaveBadge();
  // שמירה ושחזור של מיקום הגלילה – כדי שלחיצה על "הגיע"/"ביטל" לא תקפיץ למעלה
  const body = document.querySelector('#tplScreen .tpl-body');
  if (body) { body.scrollTop = TR_VIEW_SCROLL; body.onscroll = () => { TR_VIEW_SCROLL = body.scrollTop; }; }
  document.querySelectorAll('.tr-stg[data-go]').forEach(el => el.onclick = () => trGoStage(el.dataset.go));

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('trImport', trImport);
  on('trAdd', () => trPerson(-1));
  on('trShare', trShareList);
  on('trEditBtn', () => trEdit(t));
  on('trBack', () => trGoStage('הרשמה'));
  on('trReopen', () => trGoStage('יום ההדרכה'));
  on('trNext', () => trGoStage(stage === 'הרשמה' ? 'יום ההדרכה' : 'סגורה'));

  document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    const p = t.people[+b.dataset.st];
    const v = b.dataset.v;
    p.status = p.status === v ? 'נרשם' : v;
    trSaveSoon(); trView();
  });
  document.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => trPerson(+el.dataset.edit));
  document.querySelectorAll('[data-send]').forEach(b => b.onclick = () => trSend(+b.dataset.send, b.dataset.kind));
}

function trPersonRow(t, p, i, filled, num) {
  const stage = t.stage;
  const came = p.status === 'הגיע', no = p.status === 'לא הגיע', cancel = p.status === 'ביטל';
  const f = t.track && came && hasFilled(p.phone, filled);
  const tags = [];
  if (cancel) tags.push('<span class="tr-tag no">ביטל</span>');
  if (stage !== 'הרשמה' && t.track && came) {
    if (f) tags.push('<span class="tr-tag ok">✓ מילא טופס</span>');
    else if (p.sentAt) tags.push('<span class="tr-tag wait">⏳ עוד לא מילא טופס</span>');
  }
  if (p.sentAt) tags.push(`<span class="tr-tag sent">✉️ ${escHtml(p.sentAt)}</span>`);
  if (p.phone && !phoneValid(p.phone)) tags.push('<span class="tr-tag no">⚠️ טלפון לא תקין</span>');

  let actions = '';
  if (stage === 'הרשמה') {
    actions = `
      ${!cancel && p.phone && t.msgReminder ? `<button class="tr-act send" data-send="${i}" data-kind="reminder">🔔 שלח הודעת תזכורת</button>` : ''}
      <button class="tr-act ${cancel ? 'on-no' : ''}" data-st="${i}" data-v="ביטל">${cancel ? '↩︎ החזר לרשימה' : '✗ ביטל / לא מגיע'}</button>`;
  } else if (stage === 'יום ההדרכה') {
    actions = cancel ? '' : `
      <button class="tr-act ${came ? 'on-yes' : ''}" data-st="${i}" data-v="הגיע">✓ הגיע</button>
      <button class="tr-act ${no ? 'on-no' : ''}" data-st="${i}" data-v="לא הגיע">✗ לא הגיע</button>
      ${came && p.phone && t.msgFinal ? `<button class="tr-act send" data-send="${i}" data-kind="final">${t.track ? '📋 שלח טופס' : '💬 שלח הודעה'}</button>` : ''}`;
  } else {
    actions = came && p.phone && t.msgFinal && t.track && !f ? `<button class="tr-act send" data-send="${i}" data-kind="final">📋 שלח טופס שוב</button>` : '';
  }
  return `<div class="tr-person ${cancel || no ? 'no' : ''}">
    <div class="tr-p-main" ${stage !== 'סגורה' ? `data-edit="${i}"` : ''}>
      <div class="tr-p-name">${num ? `<span class="num-badge">${num}</span>` : ''}${escHtml(p.name || '(ללא שם)')}${stage !== 'סגורה' ? ' <span class="tr-edit-hint">✏️</span>' : ''}</div>
      <div class="tr-p-sub">${escHtml(p.city || '')}${p.city ? ' · ' : ''}<span class="area-phone">${escHtml(p.phone || 'אין טלפון')}</span></div>
      ${p.note ? `<div class="tr-p-note">📝 ${escHtml(p.note)}</div>` : ''}
      ${tags.length ? `<div class="tr-p-tags">${tags.join('')}</div>` : ''}
    </div>
    ${actions.trim() ? `<div class="tr-p-actions">${actions}</div>` : ''}
  </div>`;
}

// מעבר בין שלבים – מהכפתור הגדול או מלחיצה על הפס למעלה
function trGoStage(to) {
  const t = TR_CUR;
  if (!t || to === t.stage) return;
  if (to === 'סגורה') return trCloseScreen();
  if (t.stage === 'סגורה' && !confirm('לפתוח מחדש את ההדרכה לעריכה?')) return;
  t.stage = to;
  TR_VIEW_SCROLL = 0;
  trSaveSoon(); trView();
}

// ── שליחה: פותח צ'אט ישיר בוואטסאפ עם ההודעה מוכנה ──
function trSend(i, kind) {
  const t = TR_CUR, p = t.people[i];
  const title = kind === 'reminder' ? t.msgReminder : t.msgFinal;
  const tpl = tplByTitle(title);
  if (!tpl) { showToast(`ההודעה "${title}" לא נמצאה – בחר הודעה ב"✏️ פרטי ההדרכה"`, 'err'); return; }
  if (!phoneValid(p.phone)) { showToast('מספר הטלפון לא תקין – לחץ על השם כדי לתקן', 'err'); return; }
  openExternal(waLink(p.phone, fillVars(tpl.text, p, t)));

  const now = new Date();
  p.sentAt = `${pad2(now.getDate())}/${pad2(now.getMonth() + 1)} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  trView();
  // טאב המעקב: רק הודעת סיום עם מעקב טופס, בהדרכה אמיתית, למי שהגיע ועוד לא מילא
  const track = kind === 'final' && t.track && !t.test && p.status === 'הגיע' && !hasFilled(p.phone, filledSet());
  clearTimeout(TR_SAVE_TIMER);
  mediaCall('POST', { action: 'saveTraining', training: t })
    .then(() => mediaCall('POST', { action: 'logSend', id: t.id, phone: p.phone, name: p.name, track, note: `${t.type || 'הדרכה'} ${isoToHe(t.date)}` }))
    .then(r => { if (r.added) showToast('נוסף לטאב המעקב ✓', 'ok'); TR_SAVE_STATE = 'saved'; trSaveBadge(); })
    .catch(e => showToast('הרישום בגיליון נכשל: ' + e.message, 'err'));
}

// ── שליחת רשימה כהודעת וואטסאפ ──
function trShareList() {
  const t = TR_CUR;
  const reg = t.stage === 'הרשמה';
  let phones = true, withNo = !reg;
  const build = () => {
    const main = (t.people || []).filter(p => reg ? p.status !== 'ביטל' : p.status === 'הגיע');
    const lines = [`*${t.type || 'הדרכה'} · ${isoToHe(t.date)}*`];
    const info = [t.place, t.time].filter(Boolean).join(' · ');
    if (info) lines.push(`*${info}*`);
    lines.push(`*${reg ? 'נרשמו' : 'הגיעו'} ${main.length} משתתפים:*`, '');
    main.forEach((p, k) => {
      lines.push(`${k + 1}. *${p.name || '(ללא שם)'}*${p.city ? ' – ' + p.city : ''}`);
      if (phones && p.phone) lines.push(`      ${p.phone}`);
    });
    if (withNo) {
      const no = (t.people || []).filter(p => p.status === 'לא הגיע' || p.status === 'נרשם');
      if (no.length) { lines.push('', `*לא הגיעו (${no.length}):*`); no.forEach(p => lines.push(p.name || p.phone)); }
    }
    return lines.join('\n');
  };
  tplShell(reg ? 'רשימת נרשמים' : 'רשימת משתתפים', `
    <label class="tr-test-row" style="margin-top:0"><input type="checkbox" id="shPh" checked> כולל טלפונים</label>
    ${reg ? '' : '<label class="tr-test-row"><input type="checkbox" id="shNo" checked> כולל "לא הגיעו"</label>'}
    <div class="tpl-label">אפשר לערוך לפני ההעתקה</div>
    <textarea class="tpl-text" id="shOut" spellcheck="false"></textarea>
    <button class="tr-big-btn" id="shCopy">📋 העתק רשימה</button>`, trView);
  const out = document.getElementById('shOut');
  const refresh = () => { out.value = build(); autoGrowEl(out); };
  refresh();
  document.getElementById('shPh').onchange = e => { phones = e.target.checked; refresh(); };
  const n = document.getElementById('shNo'); if (n) n.onchange = e => { withNo = e.target.checked; refresh(); };
  out.addEventListener('input', () => autoGrowEl(out));
  const btn = document.getElementById('shCopy');
  btn.onclick = async () => {
    const ok = await copyToClipboard(cleanText(out.value));
    btn.textContent = ok ? '✓ הועתק – אפשר להדביק בוואטסאפ' : 'ההעתקה נכשלה – סמן והעתק ידנית';
    btn.classList.toggle('done', ok);
    setTimeout(() => { btn.textContent = '📋 העתק רשימה'; btn.classList.remove('done'); }, 2500);
  };
}

// ── סגירת הדרכה ──
function trCloseScreen() {
  const t = TR_CUR;
  const filled = filledSet();
  const c = trCounts(t, filled);
  const pending = (t.people || []).filter(p => p.status === 'נרשם').length;
  const toTrack = (t.people || []).filter(p => p.status === 'הגיע' && !hasFilled(p.phone, filled)).length;
  tplShell('סגירת הדרכה', `
    ${stageBar('סגורה')}
    <div class="tr-close-box">
      <div>נרשמו: <b>${c.reg}</b></div>
      <div>הגיעו: <b>${c.came}</b></div>
      ${c.no ? `<div>לא הגיעו: <b>${c.no}</b></div>` : ''}
      ${c.cancel ? `<div>ביטלו: <b>${c.cancel}</b></div>` : ''}
      ${t.track ? `<div>מילאו טופס: <b>${c.filled}</b> · נשלח טופס: <b>${c.sent}</b></div>` : ''}
    </div>
    ${pending ? `<div class="tr-warn">⚠️ ${pending} משתתפים לא סומנו (לא "הגיע" ולא "לא הגיע"). בסגירה הם ייחשבו כ"לא הגיע".</div>` : ''}
    <div class="tpl-hint" style="font-size:15px;line-height:1.6">בסגירה:
      <br>• הרשימה הסופית נשמרת בטאב "הדרכות"
      ${t.track && !t.test ? `<br>• ${toTrack} משתתפים שהגיעו ועוד לא מילאו טופס יתווספו לטאב "ניהול שמות ווטסאפ"` : ''}
      ${t.test ? '<br>• 🧪 הדרכת ניסיון – לא נרשם בטאב המעקב ולא נכתבת הערה' : `<br>• מי שהגיע יקבל בעמודת "הערות נוספת" את השורה "${escHtml(t.type || 'הדרכה')}: ${isoToHe(t.date).replace(/\//g, '.').replace(/\.(\d{2})(\d{2})$/, '.$2')}" (מי שעוד לא מילא טופס – כשימלא)`}
      <br>• אפשר לפתוח מחדש אם צריך לתקן</div>
    <button class="tr-big-btn" id="clDo">🔒 סגור הדרכה</button>`, trView);
  document.getElementById('clDo').onclick = async e => {
    const btn = e.currentTarget;
    btn.disabled = true; btn.textContent = 'סוגר ושומר בגיליון...';
    (t.people || []).forEach(p => { if (p.status === 'נרשם') p.status = 'לא הגיע'; });
    t.stage = 'סגורה';
    clearTimeout(TR_SAVE_TIMER);
    try {
      const r = await mediaCall('POST', { action: 'closeTraining', training: t });
      const parts = ['ההדרכה נסגרה ✓'];
      if (r.added) parts.push(`${r.added} נוספו לטאב המעקב`);
      if (r.noted) parts.push(`${r.noted} קיבלו הערת הדרכה`);
      showToast(parts.join(' · '), 'ok');
      TR_SAVE_STATE = 'saved';
      trView();
    } catch (err) {
      t.stage = 'יום ההדרכה';
      showToast('הסגירה נכשלה: ' + err.message, 'err');
      btn.disabled = false; btn.textContent = '🔒 סגור הדרכה';
    }
  };
}

// ── עריכת פרטי הדרכה והודעות ──
function trEdit(t) {
  const draft = { reminder: t.msgReminder, final: t.msgFinal };
  const d = { ...t };  // עותק – נשמר רק בלחיצה על "שמור"
  const render = () => {
    trReadDetailsSafe(d);
    tplShell('פרטי ההדרכה', `
      ${trDetailsFields(d)}
      ${msgBlock('reminder', '🔔 הודעת תזכורת (נשלחת בשלב ההרשמה)', draft.reminder)}
      ${msgBlock('final', '📋 הודעת סיום (נשלחת למי שהגיע)', draft.final)}
      <div class="tr-track-note">${(() => { const tp = tplByTitle(draft.final);
        return tp && FORM_LINK_RE.test(tp.text)
          ? '📋 הודעת הסיום כוללת קישור לטופס – יוצג מי מילא, ובסגירה מי שלא מילא יתווסף לטאב המעקב'
          : 'ℹ️ הודעת הסיום בלי קישור לטופס – אין מעקב מילוי טופס'; })()}</div>
      <button class="tr-big-btn" id="trSave">💾 שמור</button>
      <button class="tr-big-btn danger" id="trDel">🗑 מחק הדרכה</button>
      <div class="tpl-hint" style="text-align:center">מחיקה מוחקת את ההדרכה ואת רשימת המשתתפים שלה מטאב "הדרכות". טאב המעקב לא משתנה.</div>`, trView);
    ['reminder', 'final'].forEach(kind => {
      const sel = document.getElementById('msg-' + kind);
      sel.onchange = async () => {
        if (sel.value === '__new__') {
          const title = (prompt('שם להודעה החדשה:') || '').trim();
          if (!title) { sel.value = draft[kind] || ''; return; }
          if (tplByTitle(title)) { showToast('כבר יש הודעה בשם הזה', 'err'); sel.value = draft[kind] || ''; return; }
          const ok = await tplSaveAll((TPL || []).concat([{ id: Date.now().toString(36), title, text: '' }]), null);
          if (!ok) return;
          draft[kind] = title; render(); openMsgEditor(kind); return;
        }
        draft[kind] = sel.value; render();
      };
      const ed = document.getElementById('edit-' + kind);
      if (ed) ed.onclick = () => openMsgEditor(kind);
    });
    document.getElementById('trSave').onclick = () => {
      trReadDetails(d);
      Object.assign(t, { date: d.date, type: d.type, time: d.time, place: d.place, test: d.test });
      t.msgReminder = draft.reminder;
      t.msgFinal = draft.final;
      const tp = tplByTitle(t.msgFinal);
      t.track = !!(tp && FORM_LINK_RE.test(tp.text));
      trSaveNow(); trView();
    };
    document.getElementById('trDel').onclick = () => trDelete(t);
  };
  const msgBlock = (kind, label, cur) => {
    const tp = tplByTitle(cur);
    const sample = { name: 'ישראל ישראלי' };
    return `<div class="tpl-label" style="margin-top:16px">${label}</div>
      <select class="tpl-input" id="msg-${kind}">
        <option value="" ${!cur ? 'selected' : ''}>🚫 בלי הודעה</option>
        ${(TPL || []).map(x => `<option ${x.title === cur ? 'selected' : ''}>${escHtml(x.title)}</option>`).join('')}
        <option value="__new__">➕ הודעה חדשה...</option>
      </select>
      ${tp ? `<div class="msg-preview" id="prev-${kind}">${escHtml(fillVars(tp.text, sample, d)) || '<i>(ההודעה ריקה)</i>'}</div>
        <button class="tr-act" id="edit-${kind}" style="width:100%;margin-top:6px">✏️ ערוך נוסח</button>` : ''}`;
  };
  const openMsgEditor = kind => {
    const tp = tplByTitle(draft[kind]);
    if (!tp) return;
    const box = document.getElementById('prev-' + kind);
    const btn = document.getElementById('edit-' + kind);
    box.outerHTML = `<textarea class="tpl-text" id="ta-${kind}" spellcheck="false" style="margin-top:6px">${escHtml(tp.text)}</textarea>
      <div class="tpl-hint">אפשר להשתמש ב-{שם}, {תאריך}, {שעה}, {מקום}. שינוי הנוסח משנה את ההודעה בכל מקום שבו היא בשימוש.</div>`;
    const ta = document.getElementById('ta-' + kind);
    autoGrowEl(ta); ta.oninput = () => autoGrowEl(ta); ta.focus();
    btn.textContent = '💾 שמור נוסח';
    btn.classList.add('on-yes');
    btn.onclick = async () => {
      const upd = (TPL || []).map(x => x.title === tp.title ? { ...x, text: cleanText(ta.value).trim() } : x);
      btn.disabled = true; btn.textContent = 'שומר...';
      if (await tplSaveAll(upd, null)) render(); else { btn.disabled = false; btn.textContent = '💾 שמור נוסח'; }
    };
  };
  render();
}
function trReadDetailsSafe(t) { if (document.getElementById('trDate')) trReadDetails(t); }

async function trDelete(t) {
  const msg = t.test
    ? 'למחוק את הדרכת הניסיון?'
    : 'למחוק את ההדרכה מטאב "הדרכות"?\n\nמה שכבר נרשם בטאב "ניהול שמות ווטסאפ" לא יימחק.';
  if (!confirm(msg)) return;
  try {
    await mediaCall('POST', { action: 'deleteTraining', id: t.id });
    TRAININGS = TRAININGS.filter(x => x.id !== t.id);
    showToast('ההדרכה נמחקה', 'ok');
    trList();
  } catch (e) { showToast('המחיקה נכשלה: ' + e.message, 'err'); }
}

// ── הוספה / עריכה של משתתף ──
function trPerson(i) {
  const t = TR_CUR;
  const isNew = i < 0;
  const p = isNew ? { name: '', phone: '', city: '', status: t.stage === 'הרשמה' ? 'נרשם' : 'הגיע', sentAt: '', note: '' } : t.people[i];
  tplShell(isNew ? 'משתתף חדש' : 'עריכת משתתף', `
    <div class="tpl-label">שם מלא</div>
    <input class="tpl-input" id="pName" value="${escHtml(p.name)}" autocomplete="off">
    <div class="tpl-label">טלפון</div>
    <input class="tpl-input" id="pPhone" value="${escHtml(p.phone)}" inputmode="tel" style="direction:ltr;text-align:right">
    <div class="tpl-label">יישוב</div>
    <input class="tpl-input" id="pCity" value="${escHtml(p.city)}" autocomplete="off">
    <div class="tpl-label">הערות</div>
    <input class="tpl-input" id="pNote" value="${escHtml(p.note || '')}" autocomplete="off" placeholder="למשל: מגיע באיחור">
    <button class="tr-big-btn" id="pSave">💾 שמור</button>
    ${isNew ? '' : '<button class="tr-big-btn danger" id="pDel">🗑 מחק משתתף</button>'}`, trView);
  if (isNew) setTimeout(() => document.getElementById('pName')?.focus(), 50);
  const ph = document.getElementById('pPhone');
  ph.oninput = () => ph.classList.toggle('bad', !!ph.value.trim() && !phoneValid(ph.value));
  ph.oninput();
  document.getElementById('pSave').onclick = () => {
    const name = document.getElementById('pName').value.replace(/\s+/g, ' ').trim();
    const phone = normPhone(ph.value);
    if (!name && !phone) { showToast('צריך שם או טלפון', 'err'); return; }
    if (phone && t.people.some((x, k) => k !== i && normPhone(x.phone) === phone)) { showToast('המספר הזה כבר ברשימה', 'err'); return; }
    Object.assign(p, { name, phone, city: document.getElementById('pCity').value.trim(), note: document.getElementById('pNote').value.trim() });
    if (isNew) t.people.push(p);
    trSaveSoon(); trView();
  };
  const del = document.getElementById('pDel');
  if (del) del.onclick = () => {
    if (!confirm('למחוק את ' + (p.name || p.phone) + ' מההדרכה?\n(אם הוא פשוט לא מגיע – עדיף "ביטל")')) return;
    t.people.splice(i, 1);
    trSaveSoon(); trView();
  };
}

// ── עדכון רשימה מוואטסאפ: רק חדשים נכנסים ──
const PHONE_RE = /(?:\+?972[-\s]?|0)5\d(?:[-\s]?\d){7}/;

function parseImportLine(line) {
  let s = cleanText(line).replace(/[*_~]/g, '').trim();
  s = s.replace(/^\s*\d{1,3}\s*[.)\-]\s*/, '');
  if (!s || /^[?\s.]*$/.test(s)) return null;
  const m = s.match(PHONE_RE);
  if (!m) return null;
  const phone = normPhone(m[0]);
  let rest = (s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length)).replace(/[,–\-|:]+/g, ' ').replace(/\s+/g, ' ').trim();
  const words = rest.split(' ').filter(Boolean);
  let city = '';
  for (let k = Math.min(3, words.length - 1); k >= 1; k--) {
    const cand = words.slice(words.length - k).join(' ');
    if (findPlace(cand)) { city = cand; words.splice(words.length - k, k); break; }
  }
  return { name: words.join(' '), phone, city };
}

function trImport() {
  pasteScreen('הדבקת רשימה מעודכנת',
    '<div class="wz-hint">העתק שוב את הודעת ההרשמה מקבוצת הוואטסאפ (עם השמות שנוספו מאז) והדבק כאן.<br>רק שמות חדשים יתווספו – מי שכבר ברשימה לא ייכנס פעמיים.</div>',
    trView, txt => {
      const t = TR_CUR;
      const existing = new Set(t.people.map(x => normPhone(x.phone)));
      const found = parsePeople(txt).map(x => ({ ...x, dup: existing.has(x.phone), on: !existing.has(x.phone) }));
      const msgOrder = found.slice(); // v50: הסדר המקורי בהודעה
      // v51: מי שכבר ברשימה למעלה, החדשים בתחתית (כל קבוצה בסדר ההודעה)
      found.sort((a, b) => b.dup - a.dup);
      const fresh = found.filter(x => !x.dup).length;
      const dupCount = found.length - fresh;
      tplShell('הדבקת רשימה מעודכנת', `
        <div class="tr-summary">${fresh ? `נמצאו <b>${fresh}</b> חדשים` : 'אין שמות חדשים'} · ${dupCount} כבר ברשימה</div>
        ${dupCount ? `<div class="ep-sep" style="color:var(--text2)">כבר ברשימה (${dupCount})</div>` : ''}
        ${editablePeople(found, { sepAt: fresh ? dupCount : -1, sepHtml: `<div class="ep-sep">🆕 חדשים להוספה (${fresh})</div>` })}
        ${fresh ? '<button class="tr-big-btn" id="impAdd">＋ הוסף את החדשים</button>' : '<button class="tr-big-btn ghost" id="impBack">חזרה</button>'}`, trView);
      // v51: מספור כפי שיהיה ברשימה הסופית (המשך המספור הקיים)
      const impNumber = () => {
        const sim = { people: t.people.slice() };
        found.filter(x => x.on && !x.dup).forEach(x => sim.people.push({ phone: x.phone, status: 'נרשם', _new: true }));
        trOrderByMsg(sim, msgOrder);
        const num = new Map(); let n = 0;
        sim.people.forEach(p => { if (p.status !== 'ביטל') num.set(normPhone(p.phone), ++n); });
        document.querySelectorAll('.ep-row').forEach(r => {
          const cb = r.querySelector('input[type=checkbox]'), b = r.querySelector('.num-badge');
          if (!cb || !b) return;
          const x = found[+cb.dataset.i];
          b.textContent = (x.dup || x.on) ? (num.get(normPhone(x.phone)) || '') : '';
        });
      };
      impNumber();
      bindEditablePeople(found, impNumber);
      // v51: גלילה לתחתית – ישר לחדשים ולכפתור ההוספה
      const ib = document.querySelector('#tplScreen .tpl-body');
      if (ib) requestAnimationFrame(() => { ib.scrollTop = ib.scrollHeight; });
      const add = document.getElementById('impAdd');
      if (add) add.onclick = () => {
        const sel = found.filter(x => x.on && !x.dup);
        sel.forEach(x => t.people.push({ name: x.name, phone: normPhone(x.phone), city: x.city, status: t.stage === 'הרשמה' ? 'נרשם' : 'הגיע', sentAt: '', note: '' }));
        trOrderByMsg(t, msgOrder);
        showToast(`נוספו ${sel.length} משתתפים`, 'ok');
        trSaveSoon(); trView();
      };
      const back = document.getElementById('impBack');
      if (back) back.onclick = () => { if (trOrderByMsg(t, msgOrder)) trSaveSoon(); trView(); };
    });
}

// v50: סידור המשתתפים לפי הסדר בהודעה. מי שלא מופיע בהודעה (נוסף ידנית) נשאר בסוף, בסדר שלו
function trOrderByMsg(t, msgOrder) {
  const rank = new Map();
  msgOrder.forEach((x, k) => { const ph = normPhone(x.phone); if (ph && !rank.has(ph)) rank.set(ph, k); });
  const before = t.people.map(p => p.phone).join('|');
  t.people = t.people.map((p, i) => ({ p, i, r: rank.has(normPhone(p.phone)) ? rank.get(normPhone(p.phone)) : Infinity }))
    .sort((a, b) => (a.r - b.r) || (a.i - b.i)).map(x => x.p);
  return t.people.map(p => p.phone).join('|') !== before;
}

// ── סוגי הדרכות ──
function trTypesScreen() {
  const items = (TR_TYPES || []).map((x, i) => `
    <div class="tr-type-row"><span>${escHtml(x)}</span>
      <button class="tr-act" data-ren="${i}">✏️ שנה</button>
      <button class="tr-act on-no" data-del="${i}">🗑 מחק</button></div>`).join('');
  tplShell('סוגי הדרכות', `
    ${items}
    <div class="tpl-label">סוג חדש</div>
    <input class="tpl-input" id="typeNew" placeholder="למשל: תרגול בוץ / כנס">
    <button class="tr-big-btn" id="typeAdd">＋ הוסף סוג</button>`, trList);
  const save = async () => {
    try { await mediaCall('POST', { action: 'saveTrainingTypes', types: TR_TYPES }); showToast('נשמר ✓', 'ok'); }
    catch (e) { showToast('השמירה נכשלה: ' + e.message, 'err'); }
    trTypesScreen();
  };
  document.getElementById('typeAdd').onclick = () => {
    const v = document.getElementById('typeNew').value.trim();
    if (!v || TR_TYPES.includes(v)) return;
    TR_TYPES.push(v); save();
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('למחוק את "' + TR_TYPES[+b.dataset.del] + '"? (הדרכות קיימות לא ישתנו)')) return;
    TR_TYPES.splice(+b.dataset.del, 1); save();
  });
  document.querySelectorAll('[data-ren]').forEach(b => b.onclick = () => {
    const i = +b.dataset.ren;
    const v = prompt('שם חדש:', TR_TYPES[i]);
    if (v && v.trim()) { TR_TYPES[i] = v.trim(); save(); }
  });
}
